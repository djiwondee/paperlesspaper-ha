services:
  homeassistant:
    image: mcr.microsoft.com/devcontainers/python:1-3.13-bookworm
    container_name: paperlesspaper_dev_homeassistant
    working_dir: /workspace
    command: >
      bash -c "pip install --quiet homeassistant &&
               ln -sfn /workspace/custom_components/paperlesspaper
                       /workspace/config/custom_components/paperlesspaper &&
               hass --config /workspace/config --debug"
    volumes:
      - ./:/workspace:cached
    ports:
      - "8123:8123"
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
