# =============================================================================
# validate.yml
# -----------------------------------------------------------------------------
# Runs HACS validation and Home Assistant hassfest on every push and PR.
# Required for the hacs/default catalog, which the Home Assistant Marketplace
# (built in since HA 2026.11) and HACS both read.
#
# Jobs:
#   validate-hacs     — same checks HACS itself uses (hacs/action)
#   validate-hassfest — validates manifest.json, translations, services
#                       against HA core (home-assistant/actions/hassfest)
#
# Triggers:
#   push              — every branch push
#   pull_request      — every PR
#   schedule          — daily at midnight UTC (catches upstream changes)
#   workflow_dispatch — manual run from the Actions tab
#
# CHANGE HISTORY
# 2026-05-18  1.0.1  Initial CI setup.
#                    Pinned actions/checkout to v4.2.2 (Node.js 24 compatible).
# 2026-11-06  2.1.4  Comments updated for the Home Assistant Marketplace, which
#                    uses the same catalog and hacs/action checks. Jobs unchanged.
# =============================================================================

name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: HACS repository validation
  # Uses the official hacs/action — runs the same validation HACS itself uses.
  # Must pass without errors or ignores to stay in the hacs/default catalog.
  # ---------------------------------------------------------------------------
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  # ---------------------------------------------------------------------------
  # Job 2: Home Assistant hassfest
  # Validates manifest.json, strings.json, translations, and service schemas
  # against the current Home Assistant core requirements.
  # ---------------------------------------------------------------------------
  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
